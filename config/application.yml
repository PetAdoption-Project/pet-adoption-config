spring:
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://${TEMPO_HOST}:4318/v1/traces

logging:
  level:
    root: INFO
    com.ua.petadoption: DEBUG

eureka:
  instance:
    metadata-map:
      management.port: ${management.server.port:${server.port}}
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/